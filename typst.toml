[package]
name = "ypst-template"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["Jay Waves"]
license = "MIT"
description = "Companion template for ypst, a Typst enhancement specialized for HTML and site output."
compiler = "0.15.0"

# Checkout asset inventory. Font versions come from the embedded metadata.
[tool.ypst-template.assets.source-han-serif]
version = "2.003"
files = ["fonts/SourceHanSerifCN-Regular.otf", "fonts/SourceHanSerifCN-SemiBold.otf", "fonts/SourceHanSerifCN-Bold.otf"]
license = "fonts/LICENSE-SourceHanSerif.txt"
project = "https://github.com/adobe-fonts/source-han-serif"

[tool.ypst-template.assets.monaspace]
version = "1.400"
files = ["fonts/MonaspaceNeon-Regular.otf", "fonts/MonaspaceNeon-Bold.otf", "html/monaspace.css"]
license = "fonts/LICENSE-Monaspace.txt"
project = "https://github.com/githubnext/monaspace"

[tool.ypst-template.assets.new-computer-modern-math]
version = "4.0"
files = ["fonts/NewCMMath-Regular.otf"]
license = "fonts/NOTICE-NewCMMath.txt"
project = "https://ctan.org/pkg/newcomputermodern"

# Georgia is optional and downloaded separately; it is not in the checkout.
[tool.ypst-template.assets.georgia]
download_script = "fonts/download-georgia.py"
source = "https://downloads.sourceforge.net/project/corefonts/the%20fonts/final/georgi32.exe"
license_url = "https://corefonts.sourceforge.net/eula.htm"
