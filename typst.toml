[package]
name = "ypst-template"
version = "0.1.0"
entrypoint = "lib.typ"
authors = ["Jay Waves"]
license = "MIT"
description = "A document theme with CJK typography, theorem helpers and HTML sidenotes."
compiler = "0.15.0"

# Checkout asset inventory. Font versions come from the embedded metadata.
[tool.ypst-template.assets.pele]
version = "1.6.0"
files = ["html/pele.global.js"]
license = "html/LICENSE-Pele.txt"
source = "https://cdn.jsdelivr.net/npm/pele@1.6.0/dist/pele.global.js"
sha256 = "b82d1bcd435302779a945e1e0f4a54ea56fb26e010ce3f2122f4216fcfc095d7"

[tool.ypst-template.assets.source-han-serif]
version = "2.003"
files = ["fonts/SourceHanSerifCN-Regular.otf", "fonts/SourceHanSerifCN-SemiBold.otf", "fonts/SourceHanSerifCN-Bold.otf"]
license = "fonts/LICENSE-SourceHanSerif.txt"
project = "https://github.com/adobe-fonts/source-han-serif"

[tool.ypst-template.assets.source-han-sans]
version = "2.005"
files = ["fonts/SourceHanSansCN-Regular.otf", "fonts/SourceHanSansCN-Medium.otf", "fonts/SourceHanSansCN-Bold.otf"]
license = "fonts/LICENSE-SourceHanSans.txt"
project = "https://github.com/adobe-fonts/source-han-sans"

[tool.ypst-template.assets.iosevka]
version = "34.9.0"
files = ["fonts/Iosevka-Regular.ttf", "fonts/Iosevka-Bold.ttf"]
license = "fonts/LICENSE-Iosevka.txt"
project = "https://github.com/be5invis/Iosevka"

[tool.ypst-template.assets.new-computer-modern-math]
version = "4.0"
files = ["fonts/NewCMMath-Regular.otf"]
license = "fonts/NOTICE-NewCMMath.txt"
project = "https://ctan.org/pkg/newcomputermodern"

# Georgia is optional and downloaded separately; it is not in the checkout.
[tool.ypst-template.assets.georgia]
download_script = "fonts/download-georgia.py"
source = "https://downloads.sourceforge.net/project/corefonts/the%20fonts/final/georgi32.exe"
license_url = "https://corefonts.sourceforge.net/eula.htm"
