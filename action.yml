name: Set up ypst
description: Set up ypst for enhanced Typst HTML and site output, including Typst and the companion template.
runs:
  using: composite
  steps:
    - name: Set up Typst
      uses: typst-community/setup-typst@v5
      with:
        typst-version: 0.15.0

    - name: Download and install ypst
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        YPST_REPOSITORY: ${{ github.action_repository || github.repository }}
      run: |
        if ($env:RUNNER_ARCH -ne 'X64') {
          throw "ypst rolling release supports x64 runners only; found $env:RUNNER_ARCH"
        }
        switch ($env:RUNNER_OS) {
          'Linux' { $asset = 'ypst-linux-x64'; $binary = 'ypst' }
          'Windows' { $asset = 'ypst-windows-x64.exe'; $binary = 'ypst.exe' }
          default { throw "ypst rolling release does not support $env:RUNNER_OS" }
        }
        $directory = Join-Path $env:RUNNER_TEMP 'ypst-template-bin'
        New-Item -ItemType Directory -Force -Path $directory | Out-Null
        gh release download --repo $env:YPST_REPOSITORY --pattern $asset --dir $directory --clobber
        if ($LASTEXITCODE -ne 0) { throw 'Failed to download latest ypst release' }
        $executable = Join-Path $directory $binary
        if ($asset -ne $binary) { Move-Item -Force (Join-Path $directory $asset) $executable }
        if ($env:RUNNER_OS -eq 'Linux') {
          chmod +x $executable
          if ($LASTEXITCODE -ne 0) { throw 'Failed to mark ypst executable' }
        }
        & $executable install
        if ($LASTEXITCODE -ne 0) { throw 'Failed to install ypst-template' }
        $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
