name: Build and update ypst 0.1.0

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ypst-release-0.1.0
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            binary: ypst
            asset: ypst-linux-x64
          - platform: windows-x64
            runner: windows-latest
            binary: ypst.exe
            asset: ypst-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --release --locked
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo build --release --locked --bin ypst
      - name: Prepare release binary
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/release/${{ matrix.binary }}" "release-assets/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ypst-${{ matrix.platform }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  fonts:
    name: Package fonts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare font archive including Georgia
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p font-assets/Georgia release-assets
          cp fonts/*.otf fonts/LICENSE-*.txt fonts/NOTICE-*.txt font-assets/
          curl --fail --location --retry 3 --output font-assets/Georgia/georgi32.exe 'https://downloads.sourceforge.net/project/corefonts/the%20fonts/final/georgi32.exe'
          curl --fail --location --retry 3 --output font-assets/Georgia/EULA.html 'https://corefonts.sourceforge.net/eula.htm'
          python3 -c "import runpy; runpy.run_path('fonts/download-georgia.py')['cabinet'](open('font-assets/Georgia/georgi32.exe', 'rb').read())"
          grep -q 'Reproduction and Distribution' font-assets/Georgia/EULA.html
          tar -C font-assets -cJf release-assets/ypst-fonts.tar.xz .
          (cd release-assets && sha256sum ypst-fonts.tar.xz > ypst-fonts.tar.xz.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: ypst-fonts
          path: release-assets/ypst-fonts.tar.xz*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Update 0.1.0 release
    needs: [build, fonts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Point 0.1.0 tag at this build
        run: |
          git tag --force 0.1.0 "$GITHUB_SHA"
          git push --force origin refs/tags/0.1.0
      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1.0 >/dev/null 2>&1; then
            gh release edit 0.1.0 --title 'ypst 0.1.0' --notes "Built from commit $GITHUB_SHA."
          else
            gh release create 0.1.0 --verify-tag --title 'ypst 0.1.0' --notes "Built from commit $GITHUB_SHA."
          fi
          gh release upload 0.1.0 release-assets/ypst-linux-x64 release-assets/ypst-windows-x64.exe release-assets/ypst-fonts.tar.xz release-assets/ypst-fonts.tar.xz.sha256 --clobber
