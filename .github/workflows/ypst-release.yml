name: Build and publish ypst rolling release

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ypst-release-rolling
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            binary: ypst
            asset: ypst-linux-x64
          - platform: windows-x64
            runner: windows-latest
            binary: ypst.exe
            asset: ypst-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --release --locked
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo build --release --locked --bin ypst
      - name: Prepare release binary
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/release/${{ matrix.binary }}" "release-assets/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ypst-${{ matrix.platform }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  template:
    name: Package standalone template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare standalone template archives
        run: python3 tools/package_template.py release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: ypst-template
          path: release-assets/ypst-template-0.1.0.*
          if-no-files-found: error
          retention-days: 7

  fonts:
    name: Package fonts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare font archive including Georgia
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p font-assets/Georgia release-assets
          cp fonts/SourceHanSerifCN-*.otf fonts/MonaspaceNeon-*.otf fonts/NewCMMath-Regular.otf font-assets/
          cp fonts/LICENSE-SourceHanSerif.txt fonts/LICENSE-Monaspace.txt fonts/NOTICE-NewCMMath.txt font-assets/
          cp fonts/README.md fonts/download-georgia.py font-assets/
          curl --fail --location --retry 3 --output font-assets/Georgia/georgi32.exe 'https://downloads.sourceforge.net/project/corefonts/the%20fonts/final/georgi32.exe'
          curl --fail --location --retry 3 --output font-assets/Georgia/EULA.html 'https://corefonts.sourceforge.net/eula.htm'
          python3 -c "import runpy; runpy.run_path('fonts/download-georgia.py')['cabinet'](open('font-assets/Georgia/georgi32.exe', 'rb').read())"
          grep -q 'Reproduction and Distribution' font-assets/Georgia/EULA.html
          tar -C font-assets -cJf release-assets/ypst-fonts.tar.xz .
          (cd release-assets && sha256sum ypst-fonts.tar.xz > ypst-fonts.tar.xz.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: ypst-fonts
          path: release-assets/ypst-fonts.tar.xz*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish rolling release
    needs: [build, fonts, template]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish current build and remove previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="rolling-$(date -u +%Y%m%d)-${GITHUB_SHA:0:6}"
          printf 'Built from commit %s.\nPackage version: 0.1.0.\n' "$GITHUB_SHA" > release-notes.txt
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "ypst $tag" --notes-file release-notes.txt
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest --title "ypst $tag" --notes-file release-notes.txt

          # Keep the previous download available until the new release is complete.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          while IFS= read -r old; do
            if [[ "$old" != "$tag" && ( "$old" == "0.1.0" || "$old" == "rolling" || "$old" =~ ^rolling-[0-9]{8}-[0-9a-f]{6}$ ) ]]; then
              gh release delete "$old" --yes --cleanup-tag
            fi
          done <<< "$releases"
